<!DOCTYPE html>
<!--
  Schematic designer. Draw gates, muxes, and flip-flops, then export Verilog
  that verilog.html can draw again. Open this file directly; no server required.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schematic Designer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e7edf4;
    --bar: #ffffff;
    --panel: #ffffff;
    --line: #d5dee8;
    --line-strong: #c5d0dc;
    --text: #152033;
    --muted: #5c6b7e;
    --faint: #8b97a8;
    --accent: #1d6fe0;
    --accent-soft: #e8f2fd;
    --good: #0f7a45;
    --bad: #c53630;
    --warn: #8a5a00;
    --mono: Consolas, "Cascadia Mono", "Segoe UI Mono", ui-monospace, monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
    --shadow: 0 8px 22px rgba(21, 32, 51, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  input, textarea, select { user-select: text; font-family: inherit; }
  button, select { font-family: var(--sans); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.12);
  }
  .mark svg { display: block; }
  .brand b { display: block; font-size: 14px; font-weight: 680; letter-spacing: -0.01em; line-height: 1.15; }
  .brand small { color: var(--muted); font-size: 11px; }
  .modname {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 3px 3px 10px;
    background: #f4f7fb;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--faint);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .modname input {
    width: 148px;
    border: none;
    border-radius: 7px;
    padding: 5px 8px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text);
    background: #fff;
  }
  .modname input:focus { outline: none; }
  select.ex {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 12.5px;
    color: var(--text);
  }
  .grp {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    background: #f4f7fb;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .gdiv { width: 1px; height: 18px; background: var(--line-strong); margin: 0 2px; }
  .spacer { flex: 1; }
  button {
    background: #fff;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .grp button { background: transparent; }
  .grp button:hover:not(:disabled) { background: #fff; }
  button:hover:not(:disabled) { border-color: var(--line-strong); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 680;
    padding: 7px 12px;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--accent); }
  button.ghost {
    background: #fff;
    color: var(--accent);
    border: 1px solid #b7d3f6;
    font-weight: 650;
    padding: 7px 12px;
  }
  button.ghost:hover:not(:disabled) { background: var(--accent-soft); }
  .tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    background: #fbfcfe;
    border-bottom: 1px solid var(--line);
    min-height: 42px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 8px 5px 10px;
  }
  .tab.on {
    color: var(--text);
    background: var(--accent-soft);
    border-color: #c5ddf8;
    font-weight: 650;
  }
  .tab .x {
    border: none;
    background: transparent;
    color: var(--faint);
    padding: 0 4px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
  }
  .tab .x:hover { color: var(--bad); background: #fdeceb; }
  .addtab {
    margin-left: 4px;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
  }
  .addtab:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: #fff; }
  .app { flex: 1; min-height: 0; display: flex; }
  .pal {
    width: 220px;
    flex: none;
    background: #fbfcfe;
    border-right: 1px solid var(--line);
    overflow: auto;
    padding: 6px 8px 8px;
    scrollbar-width: thin;
  }
  .pal::-webkit-scrollbar { width: 8px; height: 6px; }
  .pal::-webkit-scrollbar-thumb { background: #c9d3df; border-radius: 8px; }
  .pg {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 8px 8px 2px;
  }
  .pi, .select-tool {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 8px;
    padding: 4px 8px;
    color: var(--text);
    font-size: 13px;
  }
  .pi svg, .select-tool svg { width: 36px; height: 22px; flex: none; }
  .pi.on, .select-tool.on {
    background: var(--accent-soft);
    border-color: #c5ddf8;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .pi:hover, .select-tool:hover { background: #f0f4f8; }
  .pi.on:hover, .select-tool.on:hover { background: var(--accent-soft); }
  .pal .help {
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.4;
    padding: 10px 8px 2px;
  }
  .pal .help p { margin: 0 0 8px; }
  .pal .help kbd {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 4px;
  }
  .stage { flex: 1; min-width: 0; position: relative; background: #eef2f7; }
  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #f5f8fb;
    touch-action: none;
    cursor: default;
  }
  #canvas.place, #canvas.wire { cursor: crosshair; }
  #canvas.pan { cursor: grab; }
  #canvas.pan:active { cursor: grabbing; }
  .hud {
    position: absolute;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .hud.top { top: 12px; }
  .hud.top:empty, .hud.top:has(#hint[hidden]) { display: none; }
  .hud.bottom { bottom: 12px; justify-content: space-between; }
  .chip {
    pointer-events: none;
    max-width: min(560px, 70%);
    padding: 6px 11px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.badge { font-weight: 650; }
  .chip.badge.ok { color: var(--good); background: #eef8f2; border-color: #c9ead6; }
  .chip.badge.bad { color: var(--bad); background: #fdeceb; border-color: #f6c9c6; }
  .chip.badge.warn { color: var(--warn); background: #fff6e6; border-color: #f3dfb4; }
  .zoomctl {
    pointer-events: auto;
    display: flex;
    align-items: stretch;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .zoomctl button {
    border: none;
    border-radius: 0;
    background: #fff;
    min-width: 32px;
    padding: 6px 10px;
    color: var(--text);
  }
  .zoomctl button:hover:not(:disabled) { background: #f4f7fb; border-color: transparent; }
  .zoomctl .zlab {
    min-width: 58px;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .zoomctl .zfit { border-left: 1px solid var(--line); font-weight: 650; }
  .side {
    width: min(400px, 40vw);
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidehead {
    padding: 12px 14px 0;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  #inspector { padding: 8px 14px 4px; overflow: auto; flex: 1; min-height: 0; }
  #inspector h2 { margin: 0 0 8px; font-size: 15px; font-weight: 680; letter-spacing: -0.01em; }
  #inspector p.note { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field > span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  .field input, .field select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: #fff;
    width: 100%;
  }
  .field input:focus, .field select:focus { border-color: #9ec4f3; outline: none; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  .pins { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 10px; }
  .pinrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 2px;
  }
  .pinrow em { color: var(--faint); font-style: normal; width: 42px; flex: none; }
  .pinrow em.in { color: #1d6fe0; }
  .pinrow em.out { color: var(--good); }
  .pinrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pinrow .netlive::before, .pinrow .netopen::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 0;
  }
  .pinrow .netlive::before { background: var(--accent); }
  .pinrow .netopen::before { background: #fff; box-shadow: inset 0 0 0 1.5px #8b97a8; }
  .pinrow button { margin-left: auto; }
  button.mini, .pinrow button.mini {
    padding: 3px 8px;
    font-size: 11px;
    border: 1px solid var(--line);
    background: #fff;
  }
  button.mini:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #issues { padding: 0 12px 8px; overflow: auto; max-height: 132px; }
  #issues:empty, #issues[hidden] { display: none; }
  .issue {
    font-size: 12px;
    line-height: 1.35;
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 8px;
    cursor: pointer;
  }
  .issue.error { color: var(--bad); background: #fdeceb; }
  .issue.warn { color: var(--warn); background: #fff6e6; }
  .code {
    flex: 0 0 38%;
    min-height: 168px;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
    background: #fbfcfe;
  }
  .codebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .code-title { font-weight: 680; }
  .codestat { color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .codebar .spacer { flex: 1; }
  #verilog {
    flex: 1;
    min-height: 0;
    border: none;
    resize: none;
    outline: none;
    margin: 0;
    padding: 10px 12px 16px;
    background: #fbfcfe;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    tab-size: 2;
  }
  #toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: #152033;
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 30;
    box-shadow: var(--shadow);
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(16, 22, 30, 0.46);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  .modal[hidden] { display: none; }
  .sheet {
    width: min(980px, 100%);
    height: min(700px, 100%);
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(16, 22, 30, 0.28);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet.compact { height: auto; max-height: min(700px, 100%); }
  .sheetbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: #fbfcfe;
  }
  .sheetbar b { font-size: 13px; }
  #sheetBody { flex: 1; min-height: 0; overflow: auto; background: #f4f7fb; }
  #sheetBody textarea {
    display: block;
    width: calc(100% - 24px);
    height: 280px;
    margin: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    resize: none;
    outline: none;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    background: #fff;
  }
  #sheetBody textarea.tex {
    height: calc(100% - 24px);
    white-space: pre;
    overflow: auto;
  }
  #texBar { flex-wrap: wrap; }
  #texStatus {
    margin-right: auto;
    max-width: min(420px, 46%);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
  }
  #sheetBody .err { color: var(--bad); padding: 16px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
  .importbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    background: #fff;
  }
  @media (max-width: 760px) {
    .brand small { display: none; }
    .pal {
      width: auto;
      max-height: 64px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      overflow: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding: 4px 6px;
    }
    .pal .pg, .pal .help { display: none; }
    .pi, .select-tool { width: auto; flex: none; white-space: nowrap; box-shadow: none; }
    .app { flex-direction: column; }
    .stage { min-height: 0; flex: 1.4; }
    .side {
      width: auto;
      height: auto;
      flex: 1;
      min-height: 0;
      border-left: none;
      border-top: 1px solid var(--line);
    }
    .code { flex: 1 1 46%; min-height: 0; }
    #inspector { flex: 1 1 54%; }
    .chip { max-width: calc(100% - 168px); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="32" height="32">
        <path d="M7 10h8.2a5.2 5.2 0 0 1 0 10.4H7z" fill="none" stroke="#fff" stroke-width="1.7"/>
        <circle cx="23.2" cy="15.2" r="1.7" fill="#fff"/>
      </svg>
    </span>
    <span>
      <b>Schematic Designer</b>
      <small>Draw a circuit, export Verilog</small>
    </span>
  </div>
  <label class="modname">Module <input id="modname" spellcheck="false" autocomplete="off"></label>
  <select id="examples" class="ex" title="Load an example"></select>
  <div class="grp" role="group" aria-label="Edit">
    <button id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" type="button" title="Redo (Ctrl+Y)">Redo</button>
    <span class="gdiv"></span>
    <button id="del" type="button" title="Delete selection (Delete)">Delete</button>
  </div>
  <div class="actions">
    <div class="grp" role="group" aria-label="File">
      <button id="imp" type="button" title="Paste Verilog or open a drawing">Import</button>
      <button id="save" type="button" title="Save the drawing (Ctrl+S)">Save</button>
    </div>
    <button id="exp" type="button" title="Download the generated Verilog">Export .v</button>
    <button id="tex" type="button" title="Convert the drawing to CircuiTikZ (LaTeX) and back">CircuiTikZ</button>
    <button id="openSim" type="button" class="ghost" title="Open this Verilog in the simulator">Simulate</button>
    <button id="preview" type="button" class="primary" title="Draw this Verilog with the schematic viewer">Preview</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="app">
  <aside class="pal" id="pal"></aside>
  <div class="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <rect id="catch" width="100%" height="100%" fill="transparent"></rect>
      <g id="world"></g>
    </svg>
    <div class="hud top">
      <span id="hint" class="chip" hidden></span>
    </div>
    <div class="hud bottom">
      <span id="badge" class="chip badge"></span>
      <div class="zoomctl">
        <button id="zout" type="button" title="Zoom out">−</button>
        <button id="zoom" type="button" class="zlab" title="Reset zoom">100%</button>
        <button id="zin" type="button" title="Zoom in">+</button>
        <button id="fit" type="button" class="zfit" title="Fit (F)">Fit</button>
      </div>
    </div>
  </div>
  <aside class="side">
    <div class="sidehead">Properties</div>
    <section id="inspector"></section>
    <section id="issues" hidden></section>
    <section class="code">
      <div class="codebar">
        <span class="code-title">Verilog</span>
        <span id="codestat" class="codestat"></span>
        <span class="spacer"></span>
        <button id="copy" type="button" class="mini">Copy</button>
      </div>
      <textarea id="verilog" readonly spellcheck="false"></textarea>
    </section>
  </aside>
</div>
<div id="toast"></div>
<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet">
    <div class="sheetbar">
      <b id="sheetTitle">Viewer</b>
      <select id="sheetMod" hidden></select>
      <select id="texStyle" class="ex" hidden title="Logic port style">
        <option value="american">American</option>
        <option value="european">European</option>
        <option value="ieeestd">IEEE</option>
      </select>
      <select id="texScope" class="ex" hidden title="Which modules to export">
        <option value="active">This module</option>
        <option value="all">All modules</option>
      </select>
      <span class="spacer"></span>
      <button id="sheetClose" type="button">Close</button>
    </div>
    <div id="sheetBody"></div>
    <div class="importbar" id="importBar" hidden>
      <button id="importGo" type="button" class="primary">Import into the drawing</button>
    </div>
    <div class="importbar" id="texBar" hidden>
      <span id="texStatus"></span>
      <button id="texRegen" type="button">From drawing</button>
      <button id="texCopy" type="button">Copy</button>
      <button id="texSave" type="button">Download .tex</button>
      <button id="texOnline" type="button" title="Compile on TeXLive.net in a new tab. Sends this TeX to a third-party server.">Open on TeXLive.net</button>
      <button id="texPdf" type="button" class="ghost" title="Compile with pdflatex on latex.ytotech.com and download the PDF. Sends this TeX to a third-party server.">Download PDF</button>
      <button id="texToSch" type="button" class="primary">Convert to schematic</button>
    </div>
  </div>
</div>
<input id="file" type="file" accept=".json,.v,.sv,.vh,.txt,.tex,.tikz,.pgf,application/json,text/plain" hidden>
<script src="schematic.js"></script>
<script src="design.js"></script>
<script src="circuitikz.js"></script>
<script src="designer.js"></script>
</body>
</html>
