<!DOCTYPE html>
<!--
  Schematic designer. Draw gates, muxes, and flip-flops, then export Verilog
  that verilog.html can draw again. Open this file directly; no server required.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schematic Designer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e6ebf1;
    --bar: #f7f8fa;
    --panel: #ffffff;
    --line: #d5dbe3;
    --text: #161b22;
    --muted: #5c6778;
    --faint: #8b95a3;
    --accent: #1d6fe0;
    --accent-soft: #e7f1fd;
    --good: #137a3e;
    --bad: #c53630;
    --warn: #8a5a00;
    --mono: Consolas, "Cascadia Mono", "Segoe UI Mono", ui-monospace, monospace;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  input, textarea, select { user-select: text; font-family: inherit; }
  button, select { font-family: var(--sans); }
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 10px;
    padding: 8px 12px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; gap: 1px; flex: none; }
  .brand b { font-family: var(--mono); font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
  .brand small { color: var(--muted); font-size: 11px; }
  .modname {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
  }
  .modname input {
    width: 160px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: #fff;
  }
  select.ex {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text);
  }
  .tools { display: flex; gap: 6px; align-items: center; }
  button {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12.5px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #b7c3d3; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 650;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  .spacer { flex: 1; }
  .tabs {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 6px 10px 0;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    min-height: 36px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 7px 7px 0 0;
    padding: 6px 8px 7px 12px;
  }
  .tab.on {
    color: var(--text);
    background: var(--panel);
    border-color: var(--line);
    font-weight: 650;
  }
  .tab .x {
    border: none;
    background: transparent;
    color: var(--faint);
    padding: 0 4px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
  }
  .tab .x:hover { color: var(--bad); background: #fdeceb; }
  .addtab { margin-bottom: 4px; }
  .app { flex: 1; min-height: 0; display: flex; }
  .pal {
    width: 212px;
    flex: none;
    background: var(--bar);
    border-right: 1px solid var(--line);
    overflow: auto;
    padding: 8px;
  }
  .pg {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--faint);
    padding: 10px 8px 4px;
  }
  .pi, .select-tool {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 8px;
    padding: 4px 8px;
    color: var(--text);
    font-size: 13px;
  }
  .pi svg, .select-tool svg { width: 36px; height: 22px; flex: none; }
  .pi.on, .select-tool.on { background: var(--accent-soft); border-color: #b9d4f7; }
  .pi:hover, .select-tool:hover { background: #eef2f6; }
  .pi.on:hover, .select-tool.on:hover { background: var(--accent-soft); }
  .pal .help {
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.45;
    padding: 12px 8px 8px;
  }
  .stage { flex: 1; min-width: 0; position: relative; background: #f7f8fb; }
  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    background-color: #f7f8fb;
    background-image: radial-gradient(circle, #c5ced8 0.9px, transparent 1px);
    background-size: 16px 16px;
    touch-action: none;
    cursor: default;
  }
  #canvas.place { cursor: crosshair; }
  #canvas.pan { cursor: grab; }
  .hintbar {
    position: absolute;
    left: 10px;
    bottom: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
    max-width: calc(100% - 20px);
  }
  .badge { font-weight: 650; }
  .badge.ok { color: var(--good); }
  .badge.bad { color: var(--bad); }
  .badge.warn { color: var(--warn); }
  .side {
    width: min(360px, 38vw);
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  @media (max-width: 860px) {
    .pal {
      width: auto;
      max-height: 118px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
      overflow: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .pal .pg, .pal .help { display: none; }
    .pi, .select-tool { width: auto; flex: none; white-space: nowrap; }
    .app { flex-direction: column; }
    .stage { min-height: 240px; }
    .side {
      width: auto;
      height: 230px;
      border-left: none;
      border-top: 1px solid var(--line);
    }
  }
  #inspector { padding: 12px 14px 4px; overflow: auto; max-height: 46%; }
  #inspector h2 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }
  #inspector p.note { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field > span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  .field input, .field select {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: #fff;
    width: 100%;
  }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  .pins { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 10px; }
  .pinrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .pinrow em { color: var(--faint); font-style: normal; width: 36px; }
  .pinrow button.mini, button.mini {
    padding: 3px 7px;
    font-size: 11px;
  }
  #issues { padding: 0 14px 8px; overflow: auto; max-height: 140px; }
  .issue { font-size: 12px; line-height: 1.35; padding: 3px 0; cursor: pointer; }
  .issue.error { color: var(--bad); }
  .issue.warn { color: var(--warn); }
  .code { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .codebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
  }
  .codebar .spacer { flex: 1; }
  #verilog, #tikz {
    flex: 1;
    min-height: 0;
    border: none;
    resize: none;
    outline: none;
    margin: 0;
    padding: 10px 12px 18px;
    background: #fbfcfe;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
  }
  #verilog[hidden], #tikz[hidden] { display: none; }
  .codebar .tabbtn {
    border: none;
    background: transparent;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 6px 8px;
    font-family: var(--mono);
    color: var(--muted);
  }
  .codebar .tabbtn.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }
  #toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: #161b22;
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 30;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(16, 22, 30, 0.46);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .modal[hidden] { display: none; }
  .sheet {
    width: min(960px, calc(100% - 40px));
    height: min(680px, calc(100% - 40px));
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 16px 50px rgba(16, 22, 30, 0.28);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet.compact { height: auto; max-height: min(680px, calc(100% - 40px)); }
  .sheetbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bar);
  }
  .sheetbar b { font-size: 13px; }
  #sheetBody { flex: 1; min-height: 0; overflow: auto; background: #f7f8fb; }
  #sheetBody textarea {
    width: 100%;
    height: 320px;
    border: none;
    resize: none;
    outline: none;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
  }
  #sheetBody .err { color: var(--bad); padding: 16px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
  .importbar { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: #fff; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <b>Schematic Designer</b>
    <small>Draw a circuit · export Verilog</small>
  </div>
  <label class="modname">Module <input id="modname" spellcheck="false" autocomplete="off"></label>
  <select id="examples" class="ex" title="Load an example"></select>
  <div class="tools">
    <button id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" type="button" title="Redo (Ctrl+Y)">Redo</button>
    <button id="del" type="button" title="Delete selection (Delete)">Delete</button>
    <button id="fit" type="button" title="Fit (F)">Fit</button>
  </div>
  <div class="spacer"></div>
  <button id="preview" type="button" class="primary" title="Compile with the schematic viewer">Viewer check</button>
  <button id="openSim" type="button" title="Send this Verilog to the simulator">Simulator</button>
  <button id="imp" type="button">Import</button>
  <button id="save" type="button">Save</button>
  <button id="exp" type="button">Verilog</button>
  <button id="pdf" type="button" title="Compile the CircuiTikZ to PDF">PDF</button>
</header>
<div class="tabs" id="tabs"></div>
<div class="app">
  <aside class="pal" id="pal"></aside>
  <div class="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <rect id="catch" width="100%" height="100%" fill="transparent"></rect>
      <g id="world"></g>
    </svg>
    <div class="hintbar">
      <span id="hint"></span>
      <span id="badge" class="badge"></span>
      <span id="zoom"></span>
    </div>
  </div>
  <aside class="side">
    <section id="inspector"></section>
    <section id="issues"></section>
    <section class="code">
      <div class="codebar">
        <button id="tabVerilog" type="button" class="tabbtn on">Verilog</button>
        <button id="tabTikz" type="button" class="tabbtn">CircuiTikZ</button>
        <span class="spacer"></span>
        <button id="tikzApply" type="button" class="mini" hidden>Update drawing</button>
        <button id="copy" type="button" class="mini">Copy</button>
      </div>
      <textarea id="verilog" readonly spellcheck="false"></textarea>
      <textarea id="tikz" spellcheck="false" hidden></textarea>
    </section>
  </aside>
</div>
<div id="toast"></div>
<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet">
    <div class="sheetbar">
      <b id="sheetTitle">Viewer</b>
      <select id="sheetMod" hidden></select>
      <span class="spacer"></span>
      <button id="sheetClose" type="button">Close</button>
    </div>
    <div id="sheetBody"></div>
    <div class="importbar" id="importBar" hidden>
      <button id="importGo" type="button" class="primary">Import into the drawing</button>
    </div>
  </div>
</div>
<input id="file" type="file" accept=".json,.v,.sv,.txt,application/json,text/plain" hidden>
<script src="schematic.js"></script>
<script src="design.js"></script>
<script src="circuitikz.js"></script>
<script src="designer.js"></script>
</body>
</html>
